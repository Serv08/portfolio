<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #007BFF, #6C63FF);
      color: white;
      text-align: center;
    }

    .welcome-container {
      max-width: 600px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 15px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 3rem;
      font-weight: bold;
    }

    p {
      font-size: 1.2rem;
      margin: 10px 0 20px;
    }

    .welcome-button {
      padding: 10px 20px;
      font-size: 1rem;
      color: white;
      background-color: #007BFF;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .welcome-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="welcome-container">
    <h1>Your Name</h1>
    <p>Hello! I’m [Your Name], a passionate developer with expertise in automation, web development, and IoT solutions. Welcome to my portfolio!</p>
    <a href="home.html" class="welcome-button">Proceed to Home</a>
  </div>

  
  <p class="visitor-count">Total Visitors: <span id="visitor-count">Loading...</span></p>
  
  <script>
    fetch('/tracker/log-visitor/')
      .then(response => response.json())
      .then(data => {
        document.getElementById('visitor-count').innerText = data.visitor_count;
      })
      .catch(err => {
        console.error('Error fetching visitor count:', err);
      });
  </script> 
  

</body>
</html>
